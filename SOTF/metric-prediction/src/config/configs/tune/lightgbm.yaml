# Ray Tune config for LightGBM hyperparameter search.
# Activate with: tune=lightgbm model=lightgbm

enabled: true
experiment_name: lightgbm_tune

# Total number of hyperparameter configurations to trial.
num_samples: 6

# Metric and direction used to pick the best trial.
# Options: rmse | mae | r2  /  min | max
metric: rmse
mode: min

# Parallel trials. Increase if you have more CPUs available.
max_concurrent_trials: 4
resources_per_trial:
  cpu: 6
  gpu: 0

# Search space: each key maps to a sampler and its bounds.
# Supported samplers: randint | uniform | loguniform | choice
search_space:
  n_estimators:
    sampler: randint
    lower: 150
    upper: 600
  max_depth:
    sampler: randint
    lower: 3
    upper: 9
  learning_rate:
    sampler: loguniform
    lower: 0.02
    upper: 0.15
  num_leaves:
    sampler: randint
    lower: 16
    upper: 64
  min_child_samples:
    sampler: randint
    lower: 20
    upper: 100
  subsample:
    sampler: uniform
    lower: 0.7
    upper: 0.95
  colsample_bytree:
    sampler: uniform
    lower: 0.7
    upper: 0.95
  reg_alpha:
    sampler: loguniform
    lower: 1.0e-6
    upper: 1.0
  reg_lambda:
    sampler: loguniform
    lower: 1.0e-4
    upper: 10.0
