# @package _global_
# All feature families (model-wise + layer-wise) for DS1-DS12 at epoch 50.
# Run with:
#   uv run metric-prediction/runner.py -cn experiments/prediction/exp_2_all_features_epoch50

hydra:
  job:
    chdir: false

dry_run: false

batch_name: Exp_2_All_Features_Epoch50
output_root: metric-prediction/outputs_prediction

evaluation:
  kind: prediction

common_overrides:
  mode: prediction
  train.save_shap_artifacts: true
  data.target_column: test_acc
  data.epoch_filter: [50]
  features.metric_families: []
  features.include_model_metrics: true
  features.include_layer_metrics: true

runs:
  # --- DS1: CIFAR-10 uniform large ---
  - experiment_name: ds1_ridge_all_features_epoch50
    overrides:
      data.parquet_path: metric-prediction/cache/prepared_datasets/1_cifar10_uniform_large_full_all_metrics_long__prepared_dataset.parquet
      model: ridge

  - experiment_name: ds1_lightgbm_all_features_epoch50
    overrides:
      data.parquet_path: metric-prediction/cache/prepared_datasets/1_cifar10_uniform_large_full_all_metrics_long__prepared_dataset.parquet
      model: lightgbm

  - experiment_name: ds1_xgboost_all_features_epoch50
    overrides:
      data.parquet_path: metric-prediction/cache/prepared_datasets/1_cifar10_uniform_large_full_all_metrics_long__prepared_dataset.parquet
      model: xgboost

  # --- DS2: CIFAR-10 large hyp random seeds ---
  - experiment_name: ds2_ridge_all_features_epoch50
    overrides:
      data.parquet_path: metric-prediction/cache/prepared_datasets/2_cifar10_large_hyp_random_seeds_full_all_metrics_long__prepared_dataset.parquet
      model: ridge

  - experiment_name: ds2_lightgbm_all_features_epoch50
    overrides:
      data.parquet_path: metric-prediction/cache/prepared_datasets/2_cifar10_large_hyp_random_seeds_full_all_metrics_long__prepared_dataset.parquet
