  - experiment_name: ds2_xgboost_all_features_epoch50
    overrides:
      data.parquet_path: metric-prediction/cache/prepared_datasets/2_cifar10_large_hyp_random_seeds_full_all_metrics_long__prepared_dataset.parquet
