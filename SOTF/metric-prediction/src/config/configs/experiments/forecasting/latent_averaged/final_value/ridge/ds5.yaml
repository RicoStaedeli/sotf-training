# @package _global_

hydra:
  job:
    chdir: false
dry_run: false

batch_name: ds5
output_root: metric-prediction/outputs/forecasting/latent_averaged/final_value/ridge
batch_root_subdir: null
evaluation:
  kind: forecasting
common_overrides:
  mode: latent_forecast
  data.pt_train_path: metric-prediction/cache/latent_representation_datasets/ds_5_tune_zoo_cifar-10_Resnet18_width_kaiming_uniform_150eps_width_2-256_encoded_checkpoints/averaged/tune_zoo_cifar-10_Resnet18_width_kaiming_uniform_150eps_width_2-256_latent_representations_train.pt
  data.pt_val_path: metric-prediction/cache/latent_representation_datasets/ds_5_tune_zoo_cifar-10_Resnet18_width_kaiming_uniform_150eps_width_2-256_encoded_checkpoints/averaged/tune_zoo_cifar-10_Resnet18_width_kaiming_uniform_150eps_width_2-256_latent_representations_val.pt
  ++data.target_parquet_path: metric-prediction/cache/prepared_datasets/5_cifar10_Resnet18_width_2-256_full_all_metrics_long__prepared_dataset.parquet
  data.target_column: test_acc
  data.target_model_min_threshold: 0
  train.random_seed: 42
  train.save_predictions: true
  train.save_feature_matrix: false
  sequence.add_delta_features: true
  sequence.include_time_features: true
  sequence.max_lag: 3
  sequence.min_history: 4
  sequence.target_mode: final_value
  model: ridge

runs:

  - experiment_name: ds5_latent_ridge_final_value
    overrides: {}

  - experiment_name: ds5_latent_ridge_final_value_with_perf
    overrides:
      sequence.observed_metric_columns: [test_acc, train_acc, test_loss, train_loss]
