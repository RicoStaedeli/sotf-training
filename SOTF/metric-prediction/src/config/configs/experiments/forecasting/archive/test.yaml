# @package _global_
# Hydra experiment plan generated from metric-prediction/experiment_batches_forecasting/exp_latent.yaml.
# Run with:
#   uv run metric-prediction/runner.py -cn experiments/forecasting/exp_7_latent_ds12

hydra:
  job:
    chdir: false

dry_run: false

# Latent-representation forecasting experiment.
#
# Uses per-epoch latent embeddings as features instead of raw weight statistics.
# Each .pt file contains one row per (model_id, epoch) — see data/latent_forecast.yaml
# for the expected dict keys.
#
# Dataset: ds12 — resnet18_tinyimagenet
# Pre-split latent train/val .pt files mirror the exact model-level split now used by
# the weight-statistic PT workflow as well:
#   - metric-prediction/cache/weight_statistic_datasets/12_phase_resnet18_tinyimagenet_full_all_metrics_long/weight_statistics_train.pt
#   - metric-prediction/cache/weight_statistic_datasets/12_phase_resnet18_tinyimagenet_full_all_metrics_long/weight_statistics_val.pt
# This keeps latent and weight-statistic forecasting directly comparable without
# relying on an extra split_csv_path at experiment time.
#
# The per-epoch latent .pt files must be generated separately via the encoding
# pipeline. They must contain model_ids, checkpoint_paths, epochs, and embeddings.
#
# Mirrors the ds12 weight-statistic pre-split forecasting setup for direct comparison:
#   - same dataset (ds12), same target (test_acc), same threshold (0)
#   - same sequence settings (max_lag=3, both final_value and horizon_value)
#   - XGBoost (default), MLP, and Ridge variants + no-lag ablation
#
# This plan now also includes latent window-sequence runs. Those runs override
# the mode and PT paths per experiment so the existing averaged-latent sweep
# remains unchanged.

batch_name: test
output_root: metric-prediction/outputs_forecasting

evaluation:
  kind: forecasting

common_overrides:
  mode: latent_forecast

  # Matching weight-statistic baseline inputs for the same split:
  # data.pt_train_path: metric-prediction/cache/weight_statistic_datasets/12_phase_resnet18_tinyimagenet_full_all_metrics_long/weight_statistics_train.pt
  # data.pt_val_path: metric-prediction/cache/weight_statistic_datasets/12_phase_resnet18_tinyimagenet_full_all_metrics_long/weight_statistics_val.pt

  data.pt_train_path: metric-prediction/cache/latent_representation_datasets/ds_12_resnet18_tinyimagenet_ckpts_encoded_checkpoints/averaged/resnet18_tinyimagenet_latent_representations_train.pt
  data.pt_val_path: metric-prediction/cache/latent_representation_datasets/ds_12_resnet18_tinyimagenet_ckpts_encoded_checkpoints/averaged/resnet18_tinyimagenet_latent_representations_val.pt
  data.target_parquet_path: metric-prediction/cache/prepared_datasets/12_phase_resnet18_tinyimagenet_full_all_metrics_long__prepared_dataset.parquet
  data.target_column: test_acc
  data.target_model_min_threshold: 0

  train.random_seed: 42
  train.save_predictions: true
  train.save_feature_matrix: false

  sequence.add_delta_features: true
  sequence.include_time_features: true
  sequence.max_lag: 3
  # Latent mode does not impute missing lag features, so lagged runs need the
  # current checkpoint plus all 3 prior checkpoints to be present.
  sequence.min_history: 4


runs:
  # ── XGBoost ──────────────────────────────────────────────────────────────
  - experiment_name: ds12_latent_xgb_final_value
    overrides:
      sequence.target_mode: final_value
      model: xgboost

  - experiment_name: ds12_latent_xgb_horizon_5
    overrides:
      sequence.target_mode: horizon_value
      sequence.horizon: 5
      model: xgboost

  # ── Ridge (linear baseline) ───────────────────────────────────────────────
  - experiment_name: ds12_latent_ridge_final_value
    overrides:
      sequence.target_mode: final_value
      model: ridge

  - experiment_name: ds12_latent_ridge_horizon_5
    overrides:
      sequence.target_mode: horizon_value
      sequence.horizon: 5
      model: ridge

  # ── No-lag ablation (embedding at t only, no history context) ────────────
  - experiment_name: ds12_latent_xgb_final_value_nolag
    overrides:
      sequence.target_mode: final_value
      sequence.max_lag: 0
      sequence.min_history: 1
      sequence.add_delta_features: false
      model: xgboost


  # ── MLP sweep: architecture, regularization, activation, LR, and loss ───
  - experiment_name: ds12_latent_mlp_final_arch32
    overrides:
      sequence.target_mode: final_value
      model: mlp_latent
      model.params.hidden_layer_sizes: [32]
      model.params.dropout: 0.0
      model.params.weight_decay: 0.001
      model.params.max_epochs: 20
      model.params.patience: 5

  - experiment_name: ds12_latent_windows_lstm_horizon_5
    overrides:
      mode: latent_windows_forecast
      data.pt_train_path: metric-prediction/cache/latent_representation_datasets/ds_12_resnet18_tinyimagenet_ckpts_encoded_checkpoints/windows/resnet18_tinyimagenet_latent_representations_train_windows.pt
      data.pt_val_path: metric-prediction/cache/latent_representation_datasets/ds_12_resnet18_tinyimagenet_ckpts_encoded_checkpoints/windows/resnet18_tinyimagenet_latent_representations_val_windows.pt
      sequence.target_mode: horizon_value
      sequence.horizon: 5
      model: lstm_latent_sequences
      model.params.max_epochs: 20
      model.params.patience: 5
