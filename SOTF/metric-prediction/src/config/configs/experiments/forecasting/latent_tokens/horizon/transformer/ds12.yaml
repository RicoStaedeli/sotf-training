# @package _global_
# Exp 10 — Hierarchical Transformer on ds12 token sequences (horizon-5 forecast).
# Run with:
#   uv run metric-prediction/runner.py -cn experiments/forecasting/exp_10_latent_tokens_transformer_horizon_ds12
#
# Dataset: ds12 — resnet18_tinyimagenet
# Input: per-checkpoint raw token sequences  (tokens variant)
# Target: test_acc  horizon-5 forecast
#
# Mirror of exp_10 on ds1 — same architecture, different dataset.
# Compares the hierarchical transformer against the LSTM (exp_9) on ds12.
#
# NOTE on sequence lengths:
#   ds12 token sequences are MUCH longer than ds1 (median ~12 800 tokens,
#   max ~642 000).  A flat transformer (local_window_size=1) would require
#   O(12800²) attention memory per sample and is completely infeasible.
#   Instead we sweep large local_window_size values so the global sequence
#   length stays manageable (≤ 200 windows after chunking).
#   We also cap raw token length at max_seq_len=16384 to clip the long tail
#   while keeping the median intact.
#
#   local_window_size=128  → global ≤ ceil(16384/128) = 128 windows
#   local_window_size=256  → global ≤ ceil(16384/256) =  64 windows
#   local_window_size=512  → global ≤ ceil(16384/512) =  32 windows

batch_name: ds12
output_root: metric-prediction/outputs/forecasting/latent_tokens/horizon/transformer
batch_root_subdir: null
evaluation:
  kind: forecasting

common_overrides:
  mode: latent_windows_transformer_forecast
  data.pt_train_path: metric-prediction/cache/latent_representation_datasets/ds_12_resnet18_tinyimagenet_ckpts_encoded_checkpoints/token/resnet18_tinyimagenet_latent_representations_train_tokens.pt
  data.pt_val_path: metric-prediction/cache/latent_representation_datasets/ds_12_resnet18_tinyimagenet_ckpts_encoded_checkpoints/token/resnet18_tinyimagenet_latent_representations_val_tokens.pt
  ++data.target_parquet_path: metric-prediction/cache/prepared_datasets/12_phase_resnet18_tinyimagenet_full_all_metrics_long__prepared_dataset.parquet
  data.target_column: test_acc
  data.target_model_min_threshold: 0
  train.random_seed: 42
  train.save_predictions: true
  train.save_feature_matrix: false
  sequence.add_delta_features: true
  sequence.include_time_features: true
  sequence.max_lag: 3
  sequence.min_history: 4
  sequence.target_mode: horizon_value
  sequence.horizon: 5
  model: hierarchical_transformer
  model.params.max_seq_len: 16384

runs:

  - experiment_name: ds12_tokens_transformer_hier128_small
    overrides:
      model.params.local_window_size: 128
      model.params.d_model: 64
      model.params.nhead: 4
      model.params.num_local_layers: 1
      model.params.num_global_layers: 2
      model.params.dim_feedforward: 128
      model.params.dropout: 0.0
      model.params.head_hidden_layer_sizes: [32]
      model.params.use_positional_encoding: true
      model.params.batch_size: 8
      model.params.learning_rate: 0.001
      model.params.weight_decay: 0.001
      model.params.max_epochs: 200
      model.params.patience: 20
      model.params.scheduler_patience: 8

  - experiment_name: ds12_tokens_transformer_hier256_small
    overrides:
      model.params.local_window_size: 256
      model.params.d_model: 64
      model.params.nhead: 4
      model.params.num_local_layers: 1
      model.params.num_global_layers: 2
      model.params.dim_feedforward: 128
      model.params.dropout: 0.0
      model.params.head_hidden_layer_sizes: [32]
      model.params.use_positional_encoding: true
      model.params.batch_size: 8
      model.params.learning_rate: 0.001
      model.params.weight_decay: 0.001
      model.params.max_epochs: 200
      model.params.patience: 20
      model.params.scheduler_patience: 8

  - experiment_name: ds12_tokens_transformer_hier512_small
    overrides:
      model.params.local_window_size: 512
      model.params.d_model: 64
      model.params.nhead: 4
      model.params.num_local_layers: 1
      model.params.num_global_layers: 2
      model.params.dim_feedforward: 128
      model.params.dropout: 0.0
      model.params.head_hidden_layer_sizes: [32]
      model.params.use_positional_encoding: true
      model.params.batch_size: 8
      model.params.learning_rate: 0.001
      model.params.weight_decay: 0.001
      model.params.max_epochs: 200
      model.params.patience: 20
      model.params.scheduler_patience: 8

  - experiment_name: ds12_tokens_transformer_hier128_small_with_perf
    overrides:
      model.params.local_window_size: 128
      model.params.d_model: 64
      model.params.nhead: 4
      model.params.num_local_layers: 1
      model.params.num_global_layers: 2
      model.params.dim_feedforward: 128
      model.params.dropout: 0.0
      model.params.head_hidden_layer_sizes: [32]
      model.params.use_positional_encoding: true
      model.params.batch_size: 8
      model.params.learning_rate: 0.001
      model.params.weight_decay: 0.001
      model.params.max_epochs: 200
      model.params.patience: 20
      model.params.scheduler_patience: 8
      sequence.observed_metric_columns: [test_acc, train_acc, test_loss, train_loss]

  - experiment_name: ds12_tokens_transformer_hier256_small_with_perf
    overrides:
      model.params.local_window_size: 256
      model.params.d_model: 64
      model.params.nhead: 4
      model.params.num_local_layers: 1
      model.params.num_global_layers: 2
      model.params.dim_feedforward: 128
      model.params.dropout: 0.0
      model.params.head_hidden_layer_sizes: [32]
      model.params.use_positional_encoding: true
      model.params.batch_size: 8
      model.params.learning_rate: 0.001
      model.params.weight_decay: 0.001
      model.params.max_epochs: 200
      model.params.patience: 20
      model.params.scheduler_patience: 8
      sequence.observed_metric_columns: [test_acc, train_acc, test_loss, train_loss]

  - experiment_name: ds12_tokens_transformer_hier512_small_with_perf
    overrides:
      model.params.local_window_size: 512
      model.params.d_model: 64
      model.params.nhead: 4
      model.params.num_local_layers: 1
      model.params.num_global_layers: 2
      model.params.dim_feedforward: 128
      model.params.dropout: 0.0
      model.params.head_hidden_layer_sizes: [32]
      model.params.use_positional_encoding: true
      model.params.batch_size: 8
      model.params.learning_rate: 0.001
      model.params.weight_decay: 0.001
      model.params.max_epochs: 200
      model.params.patience: 20
      model.params.scheduler_patience: 8
      sequence.observed_metric_columns: [test_acc, train_acc, test_loss, train_loss]
