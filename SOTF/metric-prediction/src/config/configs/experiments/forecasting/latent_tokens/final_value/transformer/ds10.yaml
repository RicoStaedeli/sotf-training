# @package _global_
# Hierarchical Transformer on ds10 token sequences (final-value forecast).
# Run with:
#   uv run metric-prediction/runner.py -cn experiments/forecasting/latent_tokens/final_value/transformer/ds10
#
# Dataset: ds10 — stl_large_hyperparameter_10_fixed_seeds
# Input: per-checkpoint raw token sequences  (tokens variant)
# Target: test_acc  final-value forecast

batch_name: ds10
output_root: metric-prediction/outputs/forecasting/latent_tokens/final_value/transformer
batch_root_subdir: null
evaluation:
  kind: forecasting

common_overrides:
  mode: latent_windows_transformer_forecast
  data.pt_train_path: metric-prediction/cache/latent_representation_datasets/ds_10_tune_zoo_stl_large_hyperparameter_10_fixed_seeds_encoded_checkpoints/token/tune_zoo_stl_large_hyperparameter_10_fixed_seeds_latent_representations_train_tokens.pt
  data.pt_val_path: metric-prediction/cache/latent_representation_datasets/ds_10_tune_zoo_stl_large_hyperparameter_10_fixed_seeds_encoded_checkpoints/token/tune_zoo_stl_large_hyperparameter_10_fixed_seeds_latent_representations_val_tokens.pt
  ++data.target_parquet_path: metric-prediction/cache/prepared_datasets/10_stl10_large_hyp_fixed_seeds_full_all_metrics_long__prepared_dataset.parquet
  data.target_column: test_acc
  data.target_model_min_threshold: 0
  train.random_seed: 42
  train.save_predictions: true
  train.save_feature_matrix: false
  sequence.add_delta_features: true
  sequence.include_time_features: true
  sequence.max_lag: 3
  sequence.min_history: 4
  sequence.target_mode: final_value
  sequence.horizon: 5
  model: hierarchical_transformer

runs:

  - experiment_name: ds10_tokens_transformer_final_hier8_small
    overrides:
      model.params.local_window_size: 8
      model.params.d_model: 64
      model.params.nhead: 4
      model.params.num_local_layers: 1
      model.params.num_global_layers: 2
      model.params.dim_feedforward: 128
      model.params.dropout: 0.0
      model.params.head_hidden_layer_sizes: [32]
      model.params.use_positional_encoding: true
      model.params.batch_size: 16
      model.params.learning_rate: 0.001
      model.params.weight_decay: 0.001
      model.params.max_epochs: 200
      model.params.patience: 20
      model.params.scheduler_patience: 8

  - experiment_name: ds10_tokens_transformer_final_hier16_small
    overrides:
      model.params.local_window_size: 16
      model.params.d_model: 64
      model.params.nhead: 4
      model.params.num_local_layers: 1
      model.params.num_global_layers: 2
      model.params.dim_feedforward: 128
      model.params.dropout: 0.0
      model.params.head_hidden_layer_sizes: [32]
      model.params.use_positional_encoding: true
      model.params.batch_size: 16
      model.params.learning_rate: 0.001
      model.params.weight_decay: 0.001
      model.params.max_epochs: 200
      model.params.patience: 20
      model.params.scheduler_patience: 8

  - experiment_name: ds10_tokens_transformer_final_hier32_small
    overrides:
      model.params.local_window_size: 32
      model.params.d_model: 64
      model.params.nhead: 4
      model.params.num_local_layers: 1
      model.params.num_global_layers: 2
      model.params.dim_feedforward: 128
      model.params.dropout: 0.0
      model.params.head_hidden_layer_sizes: [32]
      model.params.use_positional_encoding: true
      model.params.batch_size: 16
      model.params.learning_rate: 0.001
      model.params.weight_decay: 0.001
      model.params.max_epochs: 200
      model.params.patience: 20
      model.params.scheduler_patience: 8

  - experiment_name: ds10_tokens_transformer_final_hier8_small_with_perf
    overrides:
      model.params.local_window_size: 8
      model.params.d_model: 64
      model.params.nhead: 4
      model.params.num_local_layers: 1
      model.params.num_global_layers: 2
      model.params.dim_feedforward: 128
      model.params.dropout: 0.0
      model.params.head_hidden_layer_sizes: [32]
      model.params.use_positional_encoding: true
      model.params.batch_size: 16
      model.params.learning_rate: 0.001
      model.params.weight_decay: 0.001
      model.params.max_epochs: 200
      model.params.patience: 20
      model.params.scheduler_patience: 8
      sequence.observed_metric_columns: [test_acc, train_acc, test_loss, train_loss]

  - experiment_name: ds10_tokens_transformer_final_hier16_small_with_perf
    overrides:
      model.params.local_window_size: 16
      model.params.d_model: 64
      model.params.nhead: 4
      model.params.num_local_layers: 1
      model.params.num_global_layers: 2
      model.params.dim_feedforward: 128
      model.params.dropout: 0.0
      model.params.head_hidden_layer_sizes: [32]
      model.params.use_positional_encoding: true
      model.params.batch_size: 16
      model.params.learning_rate: 0.001
      model.params.weight_decay: 0.001
      model.params.max_epochs: 200
      model.params.patience: 20
      model.params.scheduler_patience: 8
      sequence.observed_metric_columns: [test_acc, train_acc, test_loss, train_loss]

  - experiment_name: ds10_tokens_transformer_final_hier32_small_with_perf
    overrides:
      model.params.local_window_size: 32
      model.params.d_model: 64
      model.params.nhead: 4
      model.params.num_local_layers: 1
      model.params.num_global_layers: 2
      model.params.dim_feedforward: 128
      model.params.dropout: 0.0
      model.params.head_hidden_layer_sizes: [32]
      model.params.use_positional_encoding: true
      model.params.batch_size: 16
      model.params.learning_rate: 0.001
      model.params.weight_decay: 0.001
      model.params.max_epochs: 200
      model.params.patience: 20
      model.params.scheduler_patience: 8
      sequence.observed_metric_columns: [test_acc, train_acc, test_loss, train_loss]