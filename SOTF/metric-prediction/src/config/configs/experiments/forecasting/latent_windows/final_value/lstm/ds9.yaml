# @package _global_
# Moved to lstm/ subdirectory.

hydra:
  job:
    chdir: false
dry_run: false

batch_name: ds9
output_root: metric-prediction/outputs/forecasting/latent_windows/final_value/lstm
batch_root_subdir: null
evaluation:
  kind: forecasting

common_overrides:
  mode: latent_windows_forecast
  data.pt_train_path: metric-prediction/cache/latent_representation_datasets/ds_9_tune_zoo_stl_large_hyperparameter_10_random_seeds_encoded_checkpoints/windows/tune_zoo_stl_large_hyperparameter_10_random_seeds_latent_representations_train_windows.pt
  data.pt_val_path: metric-prediction/cache/latent_representation_datasets/ds_9_tune_zoo_stl_large_hyperparameter_10_random_seeds_encoded_checkpoints/windows/tune_zoo_stl_large_hyperparameter_10_random_seeds_latent_representations_val_windows.pt
  ++data.target_parquet_path: metric-prediction/cache/prepared_datasets/9_stl10_large_hyp_random_seeds_full_all_metrics_long__prepared_dataset.parquet
  data.target_column: test_acc
  data.target_model_min_threshold: 0
  train.random_seed: 42
  train.save_predictions: true
  train.save_feature_matrix: false
  sequence.add_delta_features: true
  sequence.include_time_features: true
  sequence.max_lag: 3
  sequence.min_history: 4
  sequence.target_mode: final_value
  sequence.horizon: 5
  model: lstm_latent_sequences

runs:

  - experiment_name: ds9_latent_windows_lstm_final_small
    overrides:
      model.params.hidden_size: 64
      model.params.num_layers: 1
      model.params.bidirectional: false
      model.params.dropout: 0.0
      model.params.head_hidden_layer_sizes: [32]
      model.params.batch_size: 16
      model.params.learning_rate: 0.001
      model.params.weight_decay: 0.001
      model.params.max_epochs: 200
      model.params.patience: 20
      model.params.scheduler_patience: 8

  - experiment_name: ds9_latent_windows_lstm_final_small_with_perf
    overrides:
      model.params.hidden_size: 64
      model.params.num_layers: 1
      model.params.bidirectional: false
      model.params.dropout: 0.0
      model.params.head_hidden_layer_sizes: [32]
      model.params.batch_size: 16
      model.params.learning_rate: 0.001
      model.params.weight_decay: 0.001
      model.params.max_epochs: 200
      model.params.patience: 20
      model.params.scheduler_patience: 8
      sequence.observed_metric_columns: [test_acc, train_acc, test_loss, train_loss]