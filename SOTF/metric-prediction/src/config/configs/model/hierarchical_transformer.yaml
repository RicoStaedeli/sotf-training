# Hierarchical Transformer over per-checkpoint latent sequences.
#
# Expects data.pt_path (or data.pt_train_path / data.pt_val_path) files
# whose embeddings field is a list of [seq_len_i, embedding_dim] tensors.
# Works with all three dataset variants:
#
#   average  → single vector per checkpoint  (use latent_mlp instead)
#   windows  → [n_windows, embedding_dim]    (set local_window_size: 1)
#   tokens   → [n_tokens,  embedding_dim]    (set local_window_size: N>1
#                                              to enable the local stage)
#
# Architecture overview
# ---------------------
# Stage 1 – Local encoder  (skipped when local_window_size: 1)
#   Tokens are grouped into non-overlapping chunks of `local_window_size`.
#   A shared TransformerEncoder processes each chunk; outputs are mean-pooled
#   into one window embedding per chunk.
#
# Stage 2 – Global encoder
#   A learnable [CLS] token is prepended to the window sequence.
#   A TransformerEncoder with a padding mask aggregates all windows.
#   The CLS output is passed to an MLP regression head.

name: latent_hierarchical_transformer
params:
  # --- transformer architecture ---
  d_model: 128          # internal dimension (input is projected to this)
  nhead: 4              # attention heads  (must divide d_model)
  num_local_layers: 2   # depth of local encoder  (ignored when local_window_size=1)
  num_global_layers: 2  # depth of global encoder
  local_window_size: 1  # 1 = flat transformer (no local stage)
                        # >1 = hierarchical: group tokens into windows first
  max_seq_len: null     # truncate raw token sequences to this length before attention
                        # (set to e.g. 16384 for very long token datasets like ds12)
  dim_feedforward: 256  # FFN width inside each TransformerEncoderLayer
  dropout: 0.1
  use_positional_encoding: true

  # MLP head applied to the [CLS] output, optionally concatenated with
  # scalar time / current-target features from the sequence config.
  head_hidden_layer_sizes: [64]
  activation: gelu

  # --- training ---
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.001
  max_epochs: 500
  early_stopping: true
  patience: 40

  validation_fraction: 0.15
  scheduler_factor: 0.5
  scheduler_patience: 15
  min_learning_rate: 0.00001
  gradient_clip_norm: 1.0

  loss: smooth_l1
  scale_features: true
  scale_target: true

  # Options: auto | cpu | cuda | mps
  device: auto

  random_state: ${train.random_seed}
