# LightGBM gradient-boosted trees.
# Leaf-wise growth strategy; typically faster and more memory-efficient than XGBoost
# on large feature sets. Enable hyperparameter search with tune=lightgbm.

name: lightgbm
params:
  # Loss function.
  # Options: regression (L2) | regression_l1 (L1) | huber | mape
  objective: regression

  # Number of boosting rounds (trees).
  # Range: 100 – 2000
  n_estimators: 400

  # Maximum tree depth. -1 = unlimited (rely on num_leaves to control complexity).
  max_depth: -1

  # Step size per boosting round.
  # Range: 0.01 – 0.3
  learning_rate: 0.05

  # Maximum number of leaves per tree. Primary complexity control for LightGBM.
  # Range: 16 – 256  (larger → more complex model)
  num_leaves: 31

  # Minimum number of samples required in a leaf.
  # Range: 5 – 200  (higher → more conservative)
  min_child_samples: 20

  # Row subsampling fraction per tree (set subsample_freq > 0 to activate).
  # Range: 0.5 – 1.0
  subsample: 0.8

  # Column subsampling fraction per tree.
  # Range: 0.5 – 1.0
  colsample_bytree: 0.8

  # L1 regularisation on leaf weights.
  # Range: 0.0 – 10.0
  reg_alpha: 0.0

  # L2 regularisation on leaf weights.
  # Range: 0.0 – 20.0
  reg_lambda: 0.0

  # Suppress LightGBM training output (-1 = silent, 0 = warnings, 1 = info).
  verbosity: -1

  n_jobs: 4
  random_state: ${train.random_seed}
