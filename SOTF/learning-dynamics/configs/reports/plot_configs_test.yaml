epoch_col: training_iteration
model_col: model_name

metric_aliases:
  validation_acc: [validation_acc, val_acc]
  validation_loss: [validation_loss, val_loss]

analyses:
  - name: acc_curves
    metric: test_acc
    epoch_range: [ ]
    png_dpi: 200
    avg_curves: false
    boxplot_curves: true
    boxplot_overview:
      enabled: true
      show_title: false
      single_page:
        enabled: true
        ncols: 3
      paged:
        enabled: false
        nrows: 2
        ncols: 2

