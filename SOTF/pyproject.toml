[project]
name = "master-thesis-rico-staedeli"
version = "0.1.0"
description = "Master Thesis - Rico Staedeli"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.1",
    "hydra-core>=1.3.2",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "omegaconf>=2.3.0",
    "pandas>=3.0.0",
    "pyarrow>=23.0.1",
    "ray>=2.53.0",
    "scikit-learn>=1.8.0",
    "shap>=0.51.0",
    "scipy-stubs~=1.17.0",
    "torch==2.7.1",
    "tqdm>=4.67.3",
    "wandb>=0.23.0",
    "xgboost>=3.2.0",
    "lightgbm>=4.6.0",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "torchinfo>=1.8.0",
]

[tool.uv]
# This repository is intentionally a script-first workspace, not one installable
# Python package. The three project sections expose overlapping top-level
# modules such as `evaluation`, `utils`, `config`, and `data`, so installing the
# whole repository as one package would be brittle and ambiguous.
#
# Use `uv run <section>/<script>.py ...` entry files instead of console-script
# aliases from `pyproject.toml`.
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
