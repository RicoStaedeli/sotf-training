defaults:
  - data: default
  - features: default
  - logging: default
  - predictor: naive
  - selection: default
  - sequence: default
  - _self_

experiment_name: sotf_selection
output_root: sotf-selection/outputs

hydra:
  run:
    dir: ${output_root}/${path_safe:${predictor.name}}/${path_safe:${data.target_column}}/${path_safe:${sequence.target_mode}}/horizon_${sequence.horizon}/dataset_${dataset_id_from_path:${dataset_source_path:${data.source},${data.pt_path},${data.parquet_path},${data.target_parquet_path}}}_${dataset_slug_from_path:${dataset_source_path:${data.source},${data.pt_path},${data.parquet_path},${data.target_parquet_path}}}/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
  job:
    chdir: false
