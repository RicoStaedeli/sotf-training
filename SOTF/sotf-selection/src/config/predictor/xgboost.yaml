name: xgboost
min_train_rows: 10
min_train_models: 2
fallback_strategy: current_target
include_observed_metrics: true
observed_metric_columns: [current_target, test_acc, train_acc, test_loss, train_loss]
params:
  objective: reg:squarederror
  n_estimators: 400
  max_depth: 6
  learning_rate: 0.05
  min_child_weight: 1.0
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 1.0
  tree_method: hist
  n_jobs: 4
  random_state: 42
