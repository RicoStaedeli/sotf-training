# @package _global_
batch_name: ds12_test_horizon_5_test

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      handlers: []
  hydra_logging:
    root:
      handlers: []

common_overrides:
  data.target_column: test_acc
  sequence.target_mode: horizon_value
  sequence.horizon: 5
  selection.survival_rate: 0.1
  selection.start_epoch: 20
  selection.interval: 5

predictor:
  name: naive
  strategy: current_target

runs:
  - experiment_name: naive_baseline
    predictor:
      name: naive
      strategy: current_target
    overrides:
      data.pt_path: metric-prediction/cache/weight_statistic_datasets/12_phase_resnet18_tinyimagenet_full_all_metrics_long/weight_statistics_test.pt
  
  - experiment_name: xgboost_weight_statistics
    predictor:
      name: forecast_model
      use_bundle_feature_config: true
      use_bundle_sequence_config: true
    overrides:
      data.pt_path: metric-prediction/cache/weight_statistic_datasets/12_phase_resnet18_tinyimagenet_full_all_metrics_long/weight_statistics_test.pt
      predictor.model_bundle_path: metric-prediction/outputs/forecasting/batch_experiments/Exp_4_Horizon/results/ds12_forecast_horizon_5_distribution_features/model_bundle.pkl
      predictor.used_features_path: metric-prediction/outputs/forecasting/batch_experiments/Exp_4_Horizon/results/ds12_forecast_horizon_5_distribution_features/used_features.json

  
  - experiment_name: online_xgboost_weight_statistics
    predictor:
      name: xgboost
    overrides:
      data.pt_path: metric-prediction/cache/weight_statistic_datasets/12_phase_resnet18_tinyimagenet_full_all_metrics_long/weight_statistics_test.pt
      predictor.min_train_rows: 10
      predictor.min_train_models: 2
      sequence.min_history: 4
      predictor.fallback_strategy: current_target
      predictor.include_observed_metrics: true
      predictor.observed_metric_columns: [current_target, test_acc, train_acc, test_loss, train_loss]

  - experiment_name: xgboost_latent_represenations
    predictor:
      name: forecast_model
      use_bundle_feature_config: true
      use_bundle_sequence_config: true
    overrides:
      data.source: latent_forecast
      data.parquet_path: metric-prediction/cache/prepared_datasets/12_phase_resnet18_tinyimagenet_full_all_metrics_long__prepared_dataset.parquet
      data.pt_path: metric-prediction/cache/latent_representation_datasets/ds_12_resnet18_tinyimagenet_ckpts_encoded_checkpoints/averaged/resnet18_tinyimagenet_latent_representations_test.pt
      predictor.model_bundle_path: metric-prediction/outputs/forecasting/batch_experiments/Exp_7_latent_ds12/results/ds12_latent_xgb_horizon_5/artifacts/model_bundle.pkl
      predictor.used_features_path: metric-prediction/outputs/forecasting/batch_experiments/Exp_7_latent_ds12/results/ds12_latent_xgb_horizon_5/artifacts/used_features.json

  - experiment_name: mlp_latent_represenations
    predictor:
      name: forecast_model
      use_bundle_feature_config: true
      use_bundle_sequence_config: true
    overrides:
      data.source: latent_forecast
      data.parquet_path: metric-prediction/cache/prepared_datasets/12_phase_resnet18_tinyimagenet_full_all_metrics_long__prepared_dataset.parquet
      data.pt_path: metric-prediction/cache/latent_representation_datasets/ds_12_resnet18_tinyimagenet_ckpts_encoded_checkpoints/averaged/resnet18_tinyimagenet_latent_representations_test.pt
      predictor.model_bundle_path: metric-prediction/outputs/forecasting/batch_experiments/Exp_7_latent_ds12/results/ds12_latent_mlp_horizon_5_arch256_128_64_nolayernorm/artifacts/model_bundle.pt
      predictor.used_features_path: metric-prediction/outputs/forecasting/batch_experiments/Exp_7_latent_ds12/results/ds12_latent_mlp_horizon_5_arch256_128_64_nolayernorm/artifacts/used_features.json

  - experiment_name: lstm_latent_window_representations
    predictor:
      name: forecast_model
      use_bundle_feature_config: true
      use_bundle_sequence_config: true
    overrides:
      data.source: latent_forecast
      data.parquet_path: metric-prediction/cache/prepared_datasets/12_phase_resnet18_tinyimagenet_full_all_metrics_long__prepared_dataset.parquet
      data.pt_path: metric-prediction/cache/latent_representation_datasets/ds_12_resnet18_tinyimagenet_ckpts_encoded_checkpoints/windows/resnet18_tinyimagenet_latent_representations_test_windows.pt
      predictor.model_bundle_path: metric-prediction/outputs/forecasting/batch_experiments/Exp_8_latent_windows_lstm_horizon_ds12/results/ds12_latent_windows_lstm_horizon_5_small/artifacts/model_bundle.pt
      predictor.used_features_path: metric-prediction/outputs/forecasting/batch_experiments/Exp_8_latent_windows_lstm_horizon_ds12/results/ds12_latent_windows_lstm_horizon_5_small/artifacts/used_features.json

  - experiment_name: online_lstm_latent_window_representations
    predictor:
      name: online_lstm
    overrides:
      data.source: latent_forecast
      data.parquet_path: metric-prediction/cache/prepared_datasets/12_phase_resnet18_tinyimagenet_full_all_metrics_long__prepared_dataset.parquet
      data.pt_path: metric-prediction/cache/latent_representation_datasets/ds_12_resnet18_tinyimagenet_ckpts_encoded_checkpoints/windows/resnet18_tinyimagenet_latent_representations_test_windows.pt
      sequence.min_history: 4
      predictor.min_train_rows: 10
      predictor.min_train_models: 2
      predictor.fallback_strategy: current_target
      predictor.include_observed_metrics: true
      predictor.observed_metric_columns: [current_target, test_acc, train_acc, test_loss, train_loss]
      predictor.params.hidden_size: 64
      predictor.params.num_layers: 1
      predictor.params.bidirectional: false
      predictor.params.dropout: 0.0
      predictor.params.head_hidden_layer_sizes: [32]
      predictor.params.batch_size: 16
      predictor.params.learning_rate: 0.001
      predictor.params.weight_decay: 0.001
      predictor.params.max_epochs: 200
      predictor.params.patience: 20
      predictor.params.scheduler_patience: 8

