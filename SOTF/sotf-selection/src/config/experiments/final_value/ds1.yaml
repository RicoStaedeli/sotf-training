# Batch template for horizon_value / ds1.
# Contains the stable experiment definitions shared across all SOTF parameter sweeps.
# Referenced by experiments/schedules/horizon_value/ds1.yaml via batch_config.
# Can also be used directly as a batch config if common_overrides are extended with
# selection.start_epoch, selection.survival_rate, and selection.interval.

common_overrides:
  data.target_column: test_acc
  sequence.target_mode: final_value
  sequence.horizon: 5

predictor:
  name: naive
  strategy: current_target

runs:
  - experiment_name: naive_baseline
    predictor:
      name: naive
      strategy: current_target
    overrides:
      data.pt_path: metric-prediction/cache/weight_statistic_datasets/1_cifar10_uniform_large_full_all_metrics_long/weight_statistics_test.pt
      data.pt_val_path: metric-prediction/cache/weight_statistic_datasets/1_cifar10_uniform_large_full_all_metrics_long/weight_statistics_val.pt

  - experiment_name: xgboost_perf_only
    predictor:
      name: forecast_model
      use_bundle_feature_config: true
      use_bundle_sequence_config: true
    overrides:
      data.parquet_path: metric-prediction/cache/prepared_datasets/1_cifar10_uniform_large_full_all_metrics_long__prepared_dataset.parquet
      data.model_ids_from_pt_path: metric-prediction/cache/weight_statistic_datasets/1_cifar10_uniform_large_full_all_metrics_long/weight_statistics_test.pt
      data.model_ids_from_pt_val_path: metric-prediction/cache/weight_statistic_datasets/1_cifar10_uniform_large_full_all_metrics_long/weight_statistics_val.pt
      predictor.model_bundle_path: metric-prediction/outputs/forecasting/weight_statistics/final_value/xgboost/ds1/results/ds1_ws_fv_lag3_delta_perf_only/model_bundle.pkl
      predictor.used_features_path: metric-prediction/outputs/forecasting/weight_statistics/final_value/xgboost/ds1/results/ds1_ws_fv_lag3_delta_perf_only/used_features.json

  - experiment_name: online_xgboost_perf_only
    predictor:
      name: xgboost
    overrides:
      data.parquet_path: metric-prediction/cache/prepared_datasets/1_cifar10_uniform_large_full_all_metrics_long__prepared_dataset.parquet
      data.model_ids_from_pt_path: metric-prediction/cache/weight_statistic_datasets/1_cifar10_uniform_large_full_all_metrics_long/weight_statistics_test.pt
      data.model_ids_from_pt_val_path: metric-prediction/cache/weight_statistic_datasets/1_cifar10_uniform_large_full_all_metrics_long/weight_statistics_val.pt
      predictor.min_train_rows: 10
      predictor.min_train_models: 2
      sequence.min_history: 4
      predictor.fallback_strategy: current_target
      predictor.include_observed_metrics: true
      predictor.observed_metric_columns: [current_target, test_acc, train_acc, test_loss, train_loss]
      features.include_model_metrics: false
      features.include_layer_metrics: false

  - experiment_name: mlp_perf_only
    predictor:
