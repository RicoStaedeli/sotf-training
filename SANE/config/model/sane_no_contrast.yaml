input_dim: ${data.tokenizer.tokensize}  # Derived from tokenizer tokensize via Hydra interpolation
latent_dim: 128               # Dimension of the latent tokens
n_tokens: "auto"              # Number of input tokens (usually, should be equivalent to the window size)
max_positions: "auto"         # Maximum number of positions (tokens) in the input position embeddings

defaults:
  - _self_
  - encoder: transformer
  - decoder: transformer      # Here, we use a specific config for the decoder. Please note it is possible to use "symmetric" to use the same architecture as the encoder, cf. an example in config/model/sane_small.yaml
  - projector: average
  - embedder: average
  - translator: null